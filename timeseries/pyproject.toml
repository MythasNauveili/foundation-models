[project]
name = "timeseries-evaluation"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "marimo>=0.23,<1",
    "matplotlib>=3.10,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foundation_timeseries"]
